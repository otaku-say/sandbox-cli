name: ci-apply2

on:
  push:
    branches: [ci/macos-arm64]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: 重置为 main 并应用 libc 版补丁
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout origin/main -- aiod-cli/src/ws.zig aiod-cli/src/tls13.zig
          git apply --check ci/macos-port2.patch
          git apply ci/macos-port2.patch
          git rm -q ci/macos-port2.patch .github/workflows/ci-apply2.yml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(aiod-cli): 改用 std.posix.read + libc write / 分平台熵源，支持 macOS 构建"
          git push origin "HEAD:${GITHUB_REF_NAME}"
