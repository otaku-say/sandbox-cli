name: ci-probe-args

on:
  push:
    branches: [ci/platform-matrix]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: 打印 process.zig 的 Init/Args 定义
        run: |
          ZLIB=$(dirname "$(command -v zig)")/lib/std
          sed -n '50,140p' "$ZLIB/process.zig" > probe.txt
          echo "===== mem.span / sliceTo 签名 =====" >> probe.txt
          grep -nE "pub fn (span|sliceTo|len)\(" "$ZLIB/mem.zig" | head -10 >> probe.txt
          cat probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-args
          path: probe.txt
