name: ci-apply-winargs

on:
  push:
    branches: [ci/platform-matrix]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 应用到两处 main.zig 并清理临时文件
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout origin/main -- cube-cli/src/main.zig aiod-cli/src/main.zig
          python3 ci/apply_win_args.py .
          git rm -q ci/apply_win_args.py .github/workflows/ci-apply-winargs.yml .github/workflows/ci-probe-win.yml ci/probe-trigger2
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(cli): Windows 参数按 UTF-16 转 UTF-8，支持 windows 目标构建"
          git push origin "HEAD:${GITHUB_REF_NAME}"
