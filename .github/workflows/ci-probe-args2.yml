name: ci-probe-args2

on:
  push:
    branches: [ci/platform-matrix]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: 打印 Args 定义与参数相关符号
        run: |
          ZLIB=$(dirname "$(command -v zig)")/lib/std
          {
            echo "=== process.zig 1-70 ==="
            sed -n '1,70p' "$ZLIB/process.zig"
            echo "=== args 相关符号 ==="
            grep -nE "vector|ArgIterator|pub const Args|args" "$ZLIB/process.zig" | head -60
          } > probe.txt
          cat probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-args2
          path: probe.txt
