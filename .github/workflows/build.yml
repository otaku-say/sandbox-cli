name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 目标矩阵：Cindy 支持的每个平台都要有对应产物
#   macos-arm64    aarch64-macos        （codesign - 临时签名）
#   macos-x64      x86_64-macos         （codesign - 临时签名）
#   win-x64        x86_64-windows-gnu
#   win-arm64      aarch64-windows-gnu  （无可用 arm64 Windows runner，仅校验编译）
#   linux-x64      x86_64-linux-musl
#   linux-arm64    aarch64-linux-musl

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: cube-cli, target: aarch64-linux-musl,  runner: ubuntu-24.04-arm }
          - { tool: cube-cli, target: x86_64-linux-musl,   runner: ubuntu-latest }
          - { tool: cube-cli, target: aarch64-macos,       runner: macos-14 }
          - { tool: cube-cli, target: x86_64-macos,        runner: macos-14 }
          - { tool: cube-cli, target: x86_64-windows-gnu,  runner: ubuntu-latest }
          - { tool: cube-cli, target: aarch64-windows-gnu, runner: ubuntu-latest }
          - { tool: aiod-cli, target: aarch64-linux-musl,  runner: ubuntu-24.04-arm }
          - { tool: aiod-cli, target: x86_64-linux-musl,   runner: ubuntu-latest }
          - { tool: aiod-cli, target: aarch64-macos,       runner: macos-14 }
          - { tool: aiod-cli, target: x86_64-macos,        runner: macos-14 }
          - { tool: aiod-cli, target: x86_64-windows-gnu,  runner: ubuntu-latest }
          - { tool: aiod-cli, target: aarch64-windows-gnu, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: 检查子项目是否存在
        id: probe
        run: |
          if [ -f "${{ matrix.tool }}/build.zig" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tool }} 尚无 build.zig，跳过"
          fi

      - uses: mlugg/setup-zig@v2
        if: steps.probe.outputs.exists == 'true'
        with:
          version: 0.17.0

      - name: 构建
        if: steps.probe.outputs.exists == 'true'
        working-directory: ${{ matrix.tool }}
        shell: bash
        run: |
          set -o pipefail
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} 2>&1 | tee build.log

      - name: 失败时在终端打印构建日志
        if: failure() && steps.probe.outputs.exists == 'true'
        run: cat ${{ matrix.tool }}/build.log

      - name: 失败时上传构建日志
        if: failure() && steps.probe.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: err-${{ matrix.tool }}-${{ matrix.target }}
          path: ${{ matrix.tool }}/build.log

      - name: 收集产物
        if: steps.probe.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          cp "${{ matrix.tool }}/zig-out/bin/${{ matrix.tool }}${ext}" \
             "${{ matrix.tool }}-${{ matrix.target }}${ext}"
          ls -l "${{ matrix.tool }}-${{ matrix.target }}${ext}"

      - name: macOS 临时签名
        if: steps.probe.outputs.exists == 'true' && contains(matrix.target, 'macos')
        run: |
          f="${{ matrix.tool }}-${{ matrix.target }}"
          codesign --force --sign - --timestamp=none "$f"
          codesign --verify "$f"

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.exists == 'true'
        with:
          name: ${{ matrix.tool }}-${{ matrix.target }}
          path: |
            ${{ matrix.tool }}-${{ matrix.target }}
            ${{ matrix.tool }}-${{ matrix.target }}.exe

  # 产物必须在对应平台真跑一遍 version，编译通过不等于能运行
  smoke:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { artifact: cube-cli-aarch64-linux-musl, runner: ubuntu-24.04-arm }
          - { artifact: cube-cli-x86_64-linux-musl,  runner: ubuntu-latest }
          - { artifact: cube-cli-aarch64-macos,      runner: macos-14 }
          - { artifact: cube-cli-x86_64-macos,       runner: macos-14 }
          - { artifact: cube-cli-x86_64-windows-gnu, runner: windows-latest }
          - { artifact: aiod-cli-aarch64-linux-musl, runner: ubuntu-24.04-arm }
          - { artifact: aiod-cli-x86_64-linux-musl,  runner: ubuntu-latest }
          - { artifact: aiod-cli-aarch64-macos,      runner: macos-14 }
          - { artifact: aiod-cli-x86_64-macos,       runner: macos-14 }
          - { artifact: aiod-cli-x86_64-windows-gnu, runner: windows-latest }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin

      - name: 冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          ls -la bin/
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "bin/${{ matrix.artifact }}.exe" ]; then
              exe="bin/${{ matrix.artifact }}.exe"
            else
              mv "bin/${{ matrix.artifact }}" "bin/${{ matrix.artifact }}.exe"
              exe="bin/${{ matrix.artifact }}.exe"
            fi
            "$exe" version
          else
            chmod +x "bin/${{ matrix.artifact }}"
            "bin/${{ matrix.artifact }}" version
          fi

  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          rm -f build.log
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/*
          make_latest: true
