name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: cube-cli
            target: aarch64-linux-musl
            runner: ubuntu-latest
          - tool: cube-cli
            target: x86_64-linux-musl
            runner: ubuntu-latest
          - tool: cube-cli
            target: aarch64-macos
            runner: macos-14
          - tool: aiod-cli
            target: aarch64-macos
            runner: macos-14
          - tool: aiod-cli
            target: aarch64-linux-musl
            runner: ubuntu-latest
          - tool: aiod-cli
            target: x86_64-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查子项目是否存在
        id: probe
        run: |
          if [ -f "${{ matrix.tool }}/build.zig" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.tool }} 尚无 build.zig，跳过"
          fi

      - uses: mlugg/setup-zig@v2
        if: steps.probe.outputs.exists == 'true'
        with:
          version: 0.17.0

      - name: 构建
        if: steps.probe.outputs.exists == 'true'
        working-directory: ${{ matrix.tool }}
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: 收集产物
        if: steps.probe.outputs.exists == 'true'
        run: |
          cp "${{ matrix.tool }}/zig-out/bin/${{ matrix.tool }}" \
             "${{ matrix.tool }}-${{ matrix.target }}"

      - name: macOS 临时签名
        if: steps.probe.outputs.exists == 'true' && contains(matrix.target, 'macos')
        run: |
          codesign --force --sign - --timestamp=none "${{ matrix.tool }}-${{ matrix.target }}"
          codesign --verify "${{ matrix.tool }}-${{ matrix.target }}"
          codesign -dv "${{ matrix.tool }}-${{ matrix.target }}" 2>&1 | head -5

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.exists == 'true'
        with:
          name: ${{ matrix.tool }}-${{ matrix.target }}
          path: ${{ matrix.tool }}-${{ matrix.target }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/*
          make_latest: true
